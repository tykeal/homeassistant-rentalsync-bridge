# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "Chore"
    open-pull-requests-limit: 15
    # Let fresh releases settle before proposing them (supply-chain
    # hardening; zizmor dependabot-cooldown). Security updates bypass
    # the cooldown.
    cooldown:
      default-days: 7
  - package-ecosystem: "uv"
    directory: "/rentalsync-bridge"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "Chore"
    open-pull-requests-limit: 15
    # Let fresh releases settle before proposing them (supply-chain
    # hardening; zizmor dependabot-cooldown). Security updates bypass
    # the cooldown.
    cooldown:
      default-days: 7
  - package-ecosystem: "docker"
    directory: "/rentalsync-bridge"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "Chore"
    open-pull-requests-limit: 15
    # Let fresh releases settle before proposing them (supply-chain
    # hardening; zizmor dependabot-cooldown). Security updates bypass
    # the cooldown.
    cooldown:
      default-days: 7
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "Chore"
    open-pull-requests-limit: 15
    # Let fresh releases settle before proposing them (supply-chain
    # hardening; zizmor dependabot-cooldown). Security updates bypass
    # the cooldown.
    cooldown:
      default-days: 7
