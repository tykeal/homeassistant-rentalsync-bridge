---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 Andrew Grimberg <tykeal@bardicgrove.org>

name: 'Release'

# yamllint disable-line rule:truthy
on:
  push:
    tags:
      - '**'

permissions: {}

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  repository-metadata:
    name: "Repository Metadata"
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Check out the repository
      pull-requests: read  # Read pull request metadata
    timeout-minutes: 5
    steps:
      # Audit, not block: it runs on tag pushes only, so no pull request
      # can prove an allow-list for it. Endpoints seen in harden-runner
      # telemetry, for its list once a run confirms them (see
      # .github/harden-runner/README.md):
      #   github.com:443 api.github.com:443 releases.astral.sh:443
      #   release-assets.githubusercontent.com:443 pypi.org:443
      #   files.pythonhosted.org:443
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: 'audit'

      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "Gather repository metadata"
        id: repo-metadata
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/repository-metadata-action@b5fc39002b54a9863975c89d0bd0c347a9861954  # v0.5.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_summary: 'true'
          gerrit_summary: 'false'
          artifact_upload: 'true'
          artifact_formats: 'json'

  tag-validate:
    name: 'Validate Tag Push'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: write  # Create the draft release for the tag
    timeout-minutes: 5
    outputs:
      tag: "${{ steps.tag-validate.outputs.tag_name }}"
      version: "${{ steps.strip-v.outputs.version }}"
    steps:
      # Audit, not block: it runs on tag pushes only, so no pull request
      # can prove an allow-list for it. Endpoints seen in harden-runner
      # telemetry, for its list once a run confirms them (see
      # .github/harden-runner/README.md):
      #   github.com:443 api.github.com:443 releases.astral.sh:443
      #   raw.githubusercontent.com:443 pypi.org:443
      #   files.pythonhosted.org:443
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: 'audit'

      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: 'Verify pushed tag'
        id: 'tag-validate'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/tag-validate-action@e2a80f310fd8f4f43e86e2abc5ffb032e8217a41  # v1.1.11
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          require_type: 'semver'
          reject_development: 'true'
          require_github: 'true'
          # yamllint disable-line rule:line-length
          require_signed: 'ssh,gpg-unverifiable'

      - name: 'Strip v prefix for image tags'
        id: 'strip-v'
        shell: bash
        env:
          TAG: "${{ steps.tag-validate.outputs.tag_name }}"
        run: |
          # Strip v prefix for image tags
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: 'Ensure draft release exists'
        id: 'ensure-release'
        shell: bash
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          TAG: "${{ steps.tag-validate.outputs.tag_name }}"
        run: |
          # Ensure draft release exists
          # Check if release exists and get its draft status
          if RELEASE_INFO=$(gh release view "$TAG" \
            --json isDraft 2>/dev/null); then
            IS_DRAFT=$(echo "$RELEASE_INFO" | jq -r '.isDraft')
            if [ "$IS_DRAFT" = "true" ]; then
              echo "Draft release for tag $TAG already exists"
            else
              echo "Published release for $TAG already exists"
            fi
          else
            echo "Creating draft release for tag $TAG"
            gh release create "$TAG" \
              --draft \
              --title "Release $TAG" \
              --notes "Automated release for $TAG"
          fi

  python-build:
    name: 'Python Build'
    needs: 'tag-validate'
    runs-on: 'ubuntu-latest'
    outputs:
      matrix_json: "${{ steps.python-build.outputs.matrix_json }}"
      artefact_name: "${{ steps.python-build.outputs.artefact_name }}"
      artefact_path: "${{ steps.python-build.outputs.artefact_path }}"
    permissions:
      contents: read  # Check out the repository
      id-token: write  # Sigstore signing and build provenance (OIDC)
      attestations: write  # Store build provenance attestations
    timeout-minutes: 12
    env:
      GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
    steps:
      # Audit, not block: it runs on tag pushes only, so no pull request
      # can prove an allow-list for it. Attestation signing adds the
      # sigstore hosts to the pull request list in
      # build-test/python-build.txt. Endpoints seen in harden-runner
      # telemetry, for its list once a run confirms them (see
      # .github/harden-runner/README.md):
      #   github.com:443 api.github.com:443 releases.astral.sh:443
      #   raw.githubusercontent.com:443
      #   release-assets.githubusercontent.com:443 pypi.org:443
      #   files.pythonhosted.org:443 endoflife.date:443
      #   proxy.golang.org:443 fulcio.sigstore.dev:443
      #   rekor.sigstore.dev:443 timestamp.sigstore.dev:443
      #   tuf-repo-cdn.sigstore.dev:443
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: 'audit'

      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: 'Build Python project'
        id: 'python-build'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/python-build-action@3a996fe53edf0117e283b9fef8d3aacaa9adaf02  # v2.1.2
        with:
          sigstore_sign: true
          attestations: true
          path_prefix: 'rentalsync-bridge/'

  python-tests:
    name: 'Python Tests'
    runs-on: 'ubuntu-latest'
    needs: 'python-build'
    strategy:
      fail-fast: false
      matrix: "${{ fromJson(needs.python-build.outputs.matrix_json) }}"
    permissions:
      contents: read  # Check out the repository
    timeout-minutes: 12
    steps:
      # Audit, not block: it runs on tag pushes only, so no pull request
      # can prove an allow-list for it. Endpoints seen in harden-runner
      # telemetry, for its list once a run confirms them (see
      # .github/harden-runner/README.md):
      #   github.com:443 releases.astral.sh:443
      #   raw.githubusercontent.com:443
      #   release-assets.githubusercontent.com:443 pypi.org:443
      #   files.pythonhosted.org:443
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: 'audit'

      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "Python tests [pytest] ${{ matrix.python-version }}"
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/python-test-action@644a2008072617b9cf4846ca2b9d385691f9dc67  # v1.3.3
        with:
          python_version: "${{ matrix.python-version }}"
          path_prefix: 'rentalsync-bridge/'

  python-audit:
    name: 'Python Audit'
    runs-on: 'ubuntu-latest'
    needs: 'python-build'
    strategy:
      fail-fast: false
      matrix: "${{ fromJson(needs.python-build.outputs.matrix_json) }}"
    permissions:
      contents: read  # Check out the repository
    timeout-minutes: 10
    steps:
      # Audit, not block: it runs on tag pushes only, so no pull request
      # can prove an allow-list for it. Endpoints seen in harden-runner
      # telemetry, for its list once a run confirms them (see
      # .github/harden-runner/README.md):
      #   github.com:443 raw.githubusercontent.com:443 pypi.org:443
      #   files.pythonhosted.org:443
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: 'audit'

      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "Audit dependencies ${{ matrix.python-version }}"
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/python-audit-action@379a6a772cdf47b130bae3ab47718a22518bb83c  # v0.6.4
        with:
          python_version: "${{ matrix.python-version }}"
          path_prefix: 'rentalsync-bridge/'

  sbom:
    name: 'Generate SBOM'
    runs-on: ubuntu-latest
    needs: 'python-build'
    timeout-minutes: 10
    permissions:
      contents: read  # Check out the repository
    steps:
      # Audit, not block: it runs on tag pushes only, so no pull request
      # can prove an allow-list for it. Endpoints seen in harden-runner
      # telemetry, for its list once a run confirms them (see
      # .github/harden-runner/README.md):
      #   github.com:443 astral.sh:443 releases.astral.sh:443
      #   raw.githubusercontent.com:443
      #   release-assets.githubusercontent.com:443 pypi.org:443
      #   files.pythonhosted.org:443 grype.anchore.io:443
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: 'audit'

      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "Generate SBOM"
        id: sbom
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/python-sbom-action@639001a0def8109e045818dfb3ee82cf602657af  # v0.1.4
        with:
          include_dev: "false"
          sbom_format: "both"
          path_prefix: 'rentalsync-bridge/'
          # Temporary workaround: action default 3.12 fails requires-python
          # (>=3.13) and uv then picks 3.15, which cannot build watchfiles.
          # Remove the pin once upstream handles this; see issue #101.
          python_version: "3.14"

      - name: "Upload SBOM artifacts"
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sbom-files
          path: |
            sbom-cyclonedx.json
            sbom-cyclonedx.xml
          if-no-files-found: error
          retention-days: 45

  grype:
    name: 'Grype Audit SBOM'
    runs-on: ubuntu-latest
    needs: 'sbom'
    timeout-minutes: 10
    permissions:
      issues: read  # Read maintainer-approved bypass issues
    steps:
      # Audit, not block: it runs on tag pushes only, so no pull request
      # can prove an allow-list for it. No release run has recorded this
      # job yet, so these are the endpoints of its pull request twin in
      # build-test.yaml. Endpoints seen in harden-runner telemetry, for
      # its list once a run confirms them (see
      # .github/harden-runner/README.md):
      #   github.com:443 api.github.com:443 raw.githubusercontent.com:443
      #   release-assets.githubusercontent.com:443 grype.anchore.io:443
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: 'audit'

      - name: "Download SBOM artefact"
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: sbom-files

      - name: "Grype audit SBOM"
        id: grype-audit
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/grype-scan-action@f65dca2762823cfc8f376e32fee9baa6f3292696  # v0.6.2
        with:
          sbom: 'sbom-cyclonedx.json'
          fail-on: 'medium'
          # This add-on owns its whole dependency tree through uv.lock,
          # so every package, direct or transitive, is ours to bump.
          # Gate on all of them rather than only declared ones.
          dependency-policy: 'all'
          # Gate only when an upgrade exists; unfixed advisories are
          # still reported as warnings in the summary and SARIF.
          only-fixed: 'true'
          cache-db: 'true'
          artifact-name: 'grype-scan-results'
          retention-days: 90
          summary-title: 'Grype Vulnerability Scan'
          github-token: ${{ secrets.GITHUB_TOKEN }}

  update-addon-version:
    name: 'Update Add-on Version'
    needs:
      - 'tag-validate'
      - 'python-tests'
      - 'python-audit'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: read  # Check out the repository
    timeout-minutes: 5
    steps:
      # Audit, not block: it runs on tag pushes only, so no pull request
      # can prove an allow-list for it. Endpoints seen in harden-runner
      # telemetry, for its list once a run confirms them (see
      # .github/harden-runner/README.md):
      #   github.com:443
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: 'audit'

      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: 'Update config.yaml version'
        shell: bash
        env:
          VERSION: "${{ needs.tag-validate.outputs.version }}"
        run: |
          # Update config.yaml version from tag
          echo "Setting add-on version to: $VERSION"
          sed -i "s/^version: .*/version: \"$VERSION\"/" \
            rentalsync-bridge/config.yaml
          echo "Updated config.yaml:"
          grep version rentalsync-bridge/config.yaml

      - name: 'Upload versioned config'
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: addon-config
          path: rentalsync-bridge/config.yaml
          retention-days: 45

  container-init:
    name: 'Initialize Container Build'
    needs:
      - 'tag-validate'
      - 'python-tests'
      - 'python-audit'
    runs-on: 'ubuntu-latest'
    # Computes the build matrix only; needs no token access
    permissions: {}
    timeout-minutes: 5
    outputs:
      architectures: ${{ steps.arch.outputs.architectures }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      # Audit, not block: it runs on tag pushes only, so no pull request
      # can prove an allow-list for it. Endpoints seen in harden-runner
      # telemetry, for its list once a run confirms them (see
      # .github/harden-runner/README.md):
      #   github.com:443
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: 'audit'

      - name: 'Set architectures'
        id: 'arch'
        run: |
          echo 'architectures=["amd64", "aarch64"]' \
            >> "$GITHUB_OUTPUT"

      - name: 'Prepare build matrix'
        id: 'matrix'
        # yamllint disable-line rule:line-length
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@7412f0023ea9b6e58e8bb5059f1660f51376f49a  # 2026.09.0
        with:
          architectures: ${{ steps.arch.outputs.architectures }}
          image-name: 'homeassistant-rentalsync-bridge'

  container-build:
    name: 'Build ${{ matrix.arch }} Container'
    needs:
      - 'tag-validate'
      - 'container-init'
      - 'update-addon-version'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read  # Check out the repository
      id-token: write  # Cosign keyless signing of the image (OIDC)
      issues: read  # Read maintainer-approved Grype bypass issues
      packages: write  # Push the per-arch image to GHCR
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.container-init.outputs.matrix) }}
    steps:
      # Audit, not block: it runs on tag pushes only, so no pull request
      # can prove an allow-list for it. The last recorded release predates
      # the Grype scan, so api.github.com and grype.anchore.io come from
      # the Container Scan job in build-test.yaml. Endpoints seen in
      # harden-runner telemetry, for its list once a run confirms them
      # (see .github/harden-runner/README.md):
      #   github.com:443 api.github.com:443 raw.githubusercontent.com:443
      #   release-assets.githubusercontent.com:443
      #   registry-1.docker.io:443 auth.docker.io:443
      #   production.cloudfront.docker.com:443 ghcr.io:443
      #   pkg-containers.githubusercontent.com:443
      #   dl-cdn.alpinelinux.org:443 pypi.org:443
      #   files.pythonhosted.org:443 wheels.home-assistant.io:443
      #   grype.anchore.io:443 fulcio.sigstore.dev:443
      #   rekor.sigstore.dev:443 tuf-repo-cdn.sigstore.dev:443
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: 'audit'

      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: 'Download versioned config'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: addon-config
          path: rentalsync-bridge/

      - name: 'Determine base image'
        id: 'base-image'
        shell: bash
        env:
          ARCH: "${{ matrix.arch }}"
        run: |
          # Read build_from for this architecture
          BUILD_FROM=$(yq -r \
            ".build_from.$ARCH" \
            rentalsync-bridge/build.yaml)
          if [ -z "$BUILD_FROM" ] || \
              [ "$BUILD_FROM" = "null" ]; then
            echo "::error::No build_from for $ARCH"
            exit 1
          fi
          echo "build_from=$BUILD_FROM" \
            >> "$GITHUB_OUTPUT"

      # Build into the local Docker engine without pushing, so the
      # image is scanned before any tag reaches GHCR. The steps below
      # then push and sign that same scanned image; nothing is rebuilt.
      - name: 'Build container image'
        # yamllint disable-line rule:line-length
        uses: home-assistant/builder/actions/build-image@7412f0023ea9b6e58e8bb5059f1660f51376f49a  # 2026.09.0
        with:
          arch: ${{ matrix.arch }}
          # Not pushing, so the action skips the registry login
          container-registry-password: ''
          context: 'rentalsync-bridge'
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.tag-validate.outputs.version }}
          push: 'false'
          load: 'true'
          version: ${{ needs.tag-validate.outputs.version }}
          build-args: |
            BUILD_FROM=${{ steps.base-image.outputs.build_from }}
          cosign: 'true'

      - name: 'Grype scan container image'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/grype-scan-action@f65dca2762823cfc8f376e32fee9baa6f3292696  # v0.6.2
        with:
          # yamllint disable-line rule:line-length
          target: "docker:${{ matrix.image }}:${{ needs.tag-validate.outputs.version }}"
          name: "${{ matrix.arch }} container image"
          # Gate on high and critical OS and application packages with
          # an upgrade available; unfixed advisories are reported as
          # warnings in the summary and SARIF.
          fail-on: 'high'
          only-fixed: 'true'
          dependency-policy: 'all'
          # The SBOM grype job keeps the database cache current
          cache-db: 'restore-only'
          artifact-name: "grype-image-scan-${{ matrix.arch }}"
          retention-days: 90
          summary-title: "Grype Container Scan (${{ matrix.arch }})"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Log in to GHCR'
        # yamllint disable-line rule:line-length
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: 'ghcr.io'
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Install Cosign'
        # yamllint disable-line rule:line-length
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3

      - name: 'Push and sign scanned image'
        shell: bash
        env:
          IMAGE: "${{ matrix.image }}"
          VERSION: "${{ needs.tag-validate.outputs.version }}"
        run: |
          # Push the exact image Grype scanned, then sign its digest
          docker push "${IMAGE}:${VERSION}"
          DIGEST=$(docker buildx imagetools inspect \
            "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' | \
            jq -r '.digest')
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not resolve pushed digest: ${DIGEST}"
            exit 1
          fi
          IMAGE_REF="${IMAGE}@${DIGEST}"
          for i in 1 2 3 4 5; do
            if cosign sign --yes "${IMAGE_REF}"; then
              echo "Signed: ${IMAGE_REF}"
              exit 0
            fi
            echo "Signing attempt ${i} failed, retrying..."
            sleep $((2 ** i))
          done
          echo "::error::Failed to sign image ${IMAGE_REF}"
          exit 1

  container-publish:
    name: 'Publish Multi-arch Manifest'
    needs:
      - 'tag-validate'
      - 'container-init'
      - 'container-build'
    runs-on: 'ubuntu-latest'
    permissions:
      id-token: write  # Cosign keyless signing of the manifest (OIDC)
      packages: write  # Push the multi-arch manifest to GHCR
    timeout-minutes: 10
    outputs:
      digest: "${{ steps.digest.outputs.digest }}"
      image: "${{ steps.digest.outputs.image }}"
    steps:
      # Audit, not block: it runs on tag pushes only, so no pull request
      # can prove an allow-list for it. Endpoints seen in harden-runner
      # telemetry, for its list once a run confirms them (see
      # .github/harden-runner/README.md):
      #   github.com:443 raw.githubusercontent.com:443
      #   release-assets.githubusercontent.com:443
      #   registry-1.docker.io:443 auth.docker.io:443
      #   production.cloudfront.docker.com:443 ghcr.io:443
      #   pkg-containers.githubusercontent.com:443 fulcio.sigstore.dev:443
      #   rekor.sigstore.dev:443 tuf-repo-cdn.sigstore.dev:443
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: 'audit'

      - name: 'Publish multi-arch manifest'
        # yamllint disable-line rule:line-length
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@7412f0023ea9b6e58e8bb5059f1660f51376f49a  # 2026.09.0
        with:
          # yamllint disable-line rule:line-length
          architectures: ${{ needs.container-init.outputs.architectures }}
          # yamllint disable-line rule:line-length
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: 'homeassistant-rentalsync-bridge'
          image-tags: |
            ${{ needs.tag-validate.outputs.version }}
          cosign: 'true'

      - name: 'Capture manifest digest'
        id: 'digest'
        shell: bash
        env:
          TAG: "${{ needs.tag-validate.outputs.version }}"
        run: |
          # Inspect published manifest for digest
          # yamllint disable-line rule:line-length
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/homeassistant-rentalsync-bridge"
          # Use docker manifest inspect (works without buildx
          # builder context). Tolerate failure so fallback runs.
          DIGEST=$( (docker manifest inspect \
            "${IMAGE}:${TAG}" -v 2>/dev/null | \
            jq -r 'if type == "array" then null else .Descriptor.digest end') || true)
          if [[ -z "${DIGEST}" || "${DIGEST}" == "null" ]]; then
            # Fallback: HEAD request to OCI registry API
            REPO="${GITHUB_REPOSITORY_OWNER}"
            REPO="${REPO}/homeassistant-rentalsync-bridge"
            TOKEN=$( (curl -s \
              "https://ghcr.io/token?scope=repository:${REPO}:pull" | \
              jq -r '.token') || true)
            if [[ -n "${TOKEN}" && "${TOKEN}" != "null" ]]; then
              DIGEST=$( (curl -sI \
                -H "Authorization: Bearer ${TOKEN}" \
                -H "Accept: application/vnd.oci.image.index.v1+json" \
                "https://ghcr.io/v2/${REPO}/manifests/${TAG}" | \
                (grep -i 'docker-content-digest' || true) | \
                awk '{print $2}' | tr -d '\r') || true)
            fi
          fi
          if [[ -z "${DIGEST}" || "${DIGEST}" == "null" ]]; then
            echo "::error::Failed to capture manifest digest"
            exit 1
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Manifest digest: ${DIGEST}"

      - name: 'Create container digest file'
        shell: bash
        env:
          IMAGE: "${{ steps.digest.outputs.image }}"
          TAG: "${{ needs.tag-validate.outputs.version }}"
          DIGEST: "${{ steps.digest.outputs.digest }}"
        run: |
          # Generate digest file for release asset
          cat > container-digest.txt <<EOF
          Image: ${IMAGE}:${TAG}
          Digest: ${DIGEST}
          Pull: docker pull ${IMAGE}:${TAG}
          Verify: docker pull ${IMAGE}@${DIGEST}
          EOF

      - name: 'Upload container digest'
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: container-digest
          path: container-digest.txt
          retention-days: 45

  attach-artefacts:
    name: 'Attach Artefacts to Release'
    runs-on: 'ubuntu-latest'
    needs:
      - 'tag-validate'
      - 'python-build'
      - 'update-addon-version'
      - 'sbom'
      - 'grype'
      - 'container-publish'
    permissions:
      contents: write  # Upload assets to the draft release
    timeout-minutes: 5
    env:
      GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
    steps:
      # Audit, not block: it runs on tag pushes only, so no pull request
      # can prove an allow-list for it. Endpoints seen in harden-runner
      # telemetry, for its list once a run confirms them (see
      # .github/harden-runner/README.md):
      #   github.com:443 api.github.com:443 uploads.github.com:443
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: 'audit'

      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: '⬇ Download build artefacts'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: "${{ needs.python-build.outputs.artefact_name }}"
          path: "${{ needs.python-build.outputs.artefact_path }}"

      - name: '⬇ Download add-on config'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: addon-config
          path: release-assets

      - name: '⬇ Download container digest'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: container-digest
          path: release-assets

      - name: 'Attach artefacts to release'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/release-assets-action@0ecf15d765d7898fdd31465516294a1fd2b50358  # v0.1.6
        with:
          # yamllint disable-line rule:line-length
          asset_paths: '["${{ needs.python-build.outputs.artefact_path }}/**", "release-assets/**"]'
          release_tag: "${{ needs.tag-validate.outputs.tag }}"

  promote-release:
    name: 'Promote Draft Release'
    needs:
      - 'tag-validate'
      - 'attach-artefacts'
      - 'container-publish'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: write  # Edit and publish the draft release
    timeout-minutes: 2
    outputs:
      # yamllint disable-line rule:line-length
      release_url: "${{ steps.promote-release.outputs.release_url || steps.set-promoted-url.outputs.release_url }}"
    steps:
      # Audit, not block: it runs on tag pushes only, so no pull request
      # can prove an allow-list for it. Endpoints seen in harden-runner
      # telemetry, for its list once a run confirms them (see
      # .github/harden-runner/README.md):
      #   github.com:443 api.github.com:443
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: 'audit'

      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: 'Append container info to release'
        shell: bash
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          TAG: "${{ needs.tag-validate.outputs.tag }}"
          VERSION: "${{ needs.tag-validate.outputs.version }}"
          IMAGE: "${{ needs.container-publish.outputs.image }}"
          DIGEST: "${{ needs.container-publish.outputs.digest }}"
        run: |
          # Append container pull instructions to release

          BODY=$(gh release view "$TAG" \
            --json body --jq '.body')

          # Strip existing container section for idempotency
          BODY=$(echo "$BODY" | sed '/^## Container Image$/,$d')
          # Remove trailing blank lines
          BODY=$(echo "$BODY" | sed -e :a -e '/^\n*$/{$d;N;ba}')

          # Append container section
          BODY="${BODY}

          ## Container Image

          \`\`\`
          docker pull ${IMAGE}:${VERSION}
          \`\`\`

          **Digest:** \`${DIGEST}\`

          **Verify with digest:**
          \`\`\`
          docker pull ${IMAGE}@${DIGEST}
          \`\`\`"

          gh release edit "$TAG" --notes "$BODY"

      - name: 'Check if release is already promoted'
        id: 'check-promoted'
        shell: bash
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          TAG: "${{ needs.tag-validate.outputs.tag }}"
        run: |
          if gh release view "$TAG" --json isDraft \
              --jq '.isDraft' 2>/dev/null | grep -q "false"; then
            echo "Release $TAG is already promoted"
            echo "already_promoted=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release $TAG is draft, proceeding"
            echo "already_promoted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 'Promote draft release'
        id: 'promote-release'
        if: steps.check-promoted.outputs.already_promoted == 'false'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/draft-release-promote-action@b9e1fbf7c3ca0049dabc1a6d26f0be68a6bd99d8  # v0.1.8
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          tag: "${{ needs.tag-validate.outputs.tag }}"
          latest: true

      - name: 'Set release URL for already promoted release'
        id: 'set-promoted-url'
        if: steps.check-promoted.outputs.already_promoted == 'true'
        shell: bash
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          TAG: "${{ needs.tag-validate.outputs.tag }}"
        run: |
          RELEASE_URL=$(gh release view "$TAG" \
            --json url --jq '.url')
          echo "release_url=$RELEASE_URL" >> "$GITHUB_OUTPUT"

  update-addon-store:
    name: 'Update Add-on Store'
    needs:
      - 'tag-validate'
      - 'promote-release'
    runs-on: 'ubuntu-latest'
    environment: 'release'
    # Writes to the add-on store with ADDONS_REPO_TOKEN only
    permissions: {}
    timeout-minutes: 5
    steps:
      # Audit, not block: it runs on tag pushes only, so no pull request
      # can prove an allow-list for it. Endpoints seen in harden-runner
      # telemetry, for its list once a run confirms them (see
      # .github/harden-runner/README.md):
      #   api.github.com:443
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: 'audit'

      - name: 'Create add-on store update PR'
        shell: bash
        env:
          GH_TOKEN: "${{ secrets.ADDONS_REPO_TOKEN }}"
          VERSION: "${{ needs.tag-validate.outputs.version }}"
          RELEASE_URL: "${{ needs.promote-release.outputs.release_url }}"
        run: |
          # Update rentalsync-bridge version in add-on store
          STORE_REPO="tykeal/homeassistant-addons"
          ADDON_PATH="rentalsync-bridge/config.yaml"
          BRANCH="update/rentalsync-bridge-${VERSION}"
          # yamllint disable-line rule:line-length
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # yamllint disable-line rule:line-length
          WORKFLOW_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/main/.github/workflows/release.yaml"
          BOT_NAME="github-actions[bot]"
          # yamllint disable-line rule:line-length
          BOT_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"

          # Check if PR already exists for this version
          EXISTING=$(gh pr list \
            --repo "$STORE_REPO" \
            --head "$BRANCH" \
            --state all \
            --json number --jq '.[0].number // empty' \
            2>/dev/null || true)
          if [[ -n "$EXISTING" ]]; then
            echo "PR #${EXISTING} already exists"
            echo "::notice::Add-on store PR already exists: #${EXISTING}"
            exit 0
          fi

          # Get default branch
          DEFAULT_BRANCH=$(gh api \
            "repos/${STORE_REPO}" \
            --jq '.default_branch')

          # Create or reset branch from default branch
          DEFAULT_SHA=$(gh api \
            "repos/${STORE_REPO}/git/ref/heads/${DEFAULT_BRANCH}" \
            --jq '.object.sha')
          if gh api \
            "repos/${STORE_REPO}/git/ref/heads/${BRANCH}" \
            >/dev/null 2>&1; then
            echo "::notice::Branch ${BRANCH} exists; resetting"
            gh api \
              "repos/${STORE_REPO}/git/refs/heads/${BRANCH}" \
              -X PATCH \
              -f "sha=${DEFAULT_SHA}" \
              -F "force=true"
          else
            gh api \
              "repos/${STORE_REPO}/git/refs" \
              -f "ref=refs/heads/${BRANCH}" \
              -f "sha=${DEFAULT_SHA}"
          fi

          # Fetch config.yaml from the branch to get correct SHA
          TMPFILE=$(mktemp)
          trap 'rm -f "$TMPFILE"' EXIT
          gh api \
            "repos/${STORE_REPO}/contents/${ADDON_PATH}?ref=${BRANCH}" \
            --jq '.content' | base64 -d > "$TMPFILE"
          SHA=$(gh api \
            "repos/${STORE_REPO}/contents/${ADDON_PATH}?ref=${BRANCH}" \
            --jq '.sha')

          # Update the version field in-place
          # shellcheck disable=SC2001
          sed -i "s/^version: .*/version: \"${VERSION}\"/" \
            "$TMPFILE"

          # Push updated config.yaml with bot identity
          CONTENT_B64=$(base64 -w 0 < "$TMPFILE")
          COMMIT_MSG=$(printf \
            'Chore: bump rentalsync-bridge to %s\n\nSigned-off-by: %s <%s>' \
            "$VERSION" "$BOT_NAME" "$BOT_EMAIL")
          gh api \
            "repos/${STORE_REPO}/contents/${ADDON_PATH}" \
            -X PUT \
            -f "message=${COMMIT_MSG}" \
            -f "content=${CONTENT_B64}" \
            -f "sha=${SHA}" \
            -f "branch=${BRANCH}" \
            -f "committer[name]=${BOT_NAME}" \
            -f "committer[email]=${BOT_EMAIL}" \
            -f "author[name]=${BOT_NAME}" \
            -f "author[email]=${BOT_EMAIL}"

          # Create pull request
          # yamllint disable rule:line-length
          PR_BODY=$(printf \
            'Update rentalsync-bridge add-on to version %s.\n\nRelease: %s\nWorkflow run: %s\nWorkflow source: %s' \
            "$VERSION" \
            "$RELEASE_URL" \
            "$RUN_URL" \
            "$WORKFLOW_URL")
          # yamllint enable rule:line-length
          PR_URL=$(gh pr create \
            --repo "$STORE_REPO" \
            --base "$DEFAULT_BRANCH" \
            --head "$BRANCH" \
            --title "Chore: update rentalsync-bridge to ${VERSION}" \
            --body "$PR_BODY")

          echo "::notice::Add-on store PR created: ${PR_URL}"
