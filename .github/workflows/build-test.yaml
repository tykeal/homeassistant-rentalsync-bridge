---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025 The Linux Foundation

# Runs on a new pull request, performs build and runs tests
name: 'Python Build/Test'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      clear_cache:
        description: 'Clear all Python dependency caches'
        type: boolean
        default: false
        required: false
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  repository-metadata:
    name: "Repository Metadata"
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Check out the repository
      pull-requests: read  # Read pull request metadata
    timeout-minutes: 5
    steps:
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: 'audit'

      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "Gather repository metadata"
        id: repo-metadata
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/repository-metadata-action@f0e5d2d8dc1154a5d702b75acc551eff6ba072dc  # v0.5.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_summary: 'true'
          gerrit_summary: 'false'
          artifact_upload: 'true'
          artifact_formats: 'json'

  clear-cache:
    name: 'Clear Python Caches'
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.event.inputs.clear_cache == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write  # Delete GitHub Actions caches
    timeout-minutes: 5
    env:
      GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
    steps:
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: 'audit'

      - name: 'Clear Python dependency caches'
        env:
          REPO: "${{ github.repository }}"
        run: |
          # Clear Python dependency caches
          echo "Clearing Python dependency caches 🗑️"
          deleted=0
          failed=0
          for prefix in python- setup-python- setup-uv-; do
            while true; do
              # List cache IDs, not keys: a key can repeat across refs
              # and deleting by key removes every matching entry, so a
              # later duplicate would then fail as not found.
              if ! ids=$(gh cache list --repo "$REPO" \
                --key "$prefix" --limit 100 \
                --json id --jq '.[].id' 2>&1); then
                echo "::warning::Failed to list caches" \
                  "for prefix '$prefix': $ids"
                echo "Warning: failed to list caches for" \
                  "prefix \`$prefix\`: $ids" \
                  >> "$GITHUB_STEP_SUMMARY"
                failed=1
                break
              fi
              [ -n "$ids" ] || break

              batch_deleted=0
              while IFS= read -r id; do
                [ -n "$id" ] || continue
                if delete_out=$(gh cache delete "$id" \
                  --repo "$REPO" 2>&1); then
                  echo "Deleted cache: $id"
                  deleted=$((deleted + 1))
                  batch_deleted=$((batch_deleted + 1))
                else
                  echo "::warning::Failed to delete" \
                    "cache '$id': $delete_out"
                  echo "Warning: failed to delete cache" \
                    "\`$id\`: $delete_out" \
                    >> "$GITHUB_STEP_SUMMARY"
                  failed=1
                fi
              done <<< "$ids"

              [ "$batch_deleted" -gt 0 ] || break
            done
          done
          if [ "$deleted" -gt 0 ]; then
            echo "Cleared $deleted Python cache(s) ✅" \
              >> "$GITHUB_STEP_SUMMARY"
          elif [ "$failed" -eq 0 ]; then
            echo "No Python caches found to clear 💬" \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$failed" -ne 0 ]; then
            echo "Cache clearing completed with errors ❌" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  python-build:
    # Required status check in the repository ruleset; keep this name.
    name: 'Python Build'
    needs: 'clear-cache'
    # Run after clear-cache whether it ran, was skipped or failed
    if: ${{ always() && !cancelled() }}
    runs-on: 'ubuntu-latest'
    outputs:
      matrix_json: "${{ steps.python-build.outputs.matrix_json }}"
      artefact_name: "${{ steps.python-build.outputs.artefact_name }}"
      artefact_path: "${{ steps.python-build.outputs.artefact_path }}"
    permissions:
      contents: read  # Check out the repository
    timeout-minutes: 12
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: 'audit'

      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: 'Build Python project'
        id: python-build
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/python-build-action@3a996fe53edf0117e283b9fef8d3aacaa9adaf02  # v2.1.2
        with:
          path_prefix: 'rentalsync-bridge/'

  python-tests:
    name: 'Python Tests'
    runs-on: 'ubuntu-latest'
    needs: 'python-build'
    if: ${{ !cancelled() && needs.python-build.result == 'success' }}
    # Matrix job
    strategy:
      fail-fast: false
      matrix: "${{ fromJson(needs.python-build.outputs.matrix_json) }}"
    permissions:
      contents: read  # Check out the repository
    timeout-minutes: 12
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: 'audit'

      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "Python tests [pytest] ${{ matrix.python-version }}"
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/python-test-action@644a2008072617b9cf4846ca2b9d385691f9dc67  # v1.3.3
        with:
          python_version: ${{ matrix.python-version }}
          path_prefix: 'rentalsync-bridge/'

  python-audit:
    name: 'Python Audit'
    runs-on: 'ubuntu-latest'
    needs: 'python-build'
    if: ${{ !cancelled() && needs.python-build.result == 'success' }}
    # Matrix job
    strategy:
      fail-fast: false
      matrix: "${{ fromJson(needs.python-build.outputs.matrix_json) }}"
    permissions:
      contents: read  # Check out the repository
    timeout-minutes: 10
    steps:
      # Harden the runner used by this workflow
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: 'audit'

      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "Audit dependencies ${{ matrix.python-version }}"
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/python-audit-action@379a6a772cdf47b130bae3ab47718a22518bb83c  # v0.6.4
        with:
          python_version: "${{ matrix.python-version }}"
          path_prefix: 'rentalsync-bridge/'
          permit_fail: "${{ vars.NO_BLOCK_AUDIT_FAIL == 'true' }}"

  sbom:
    name: 'Generate SBOM'
    runs-on: ubuntu-latest
    needs: 'python-build'
    if: ${{ !cancelled() && needs.python-build.result == 'success' }}
    timeout-minutes: 10
    permissions:
      contents: read  # Check out the repository
    steps:
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: 'audit'

      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "Generate SBOM"
        id: sbom
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/python-sbom-action@639001a0def8109e045818dfb3ee82cf602657af  # v0.1.4
        with:
          include_dev: "false"
          sbom_format: "both"
          path_prefix: 'rentalsync-bridge/'
          # Temporary workaround: action default 3.12 fails requires-python
          # (>=3.13) and uv then picks 3.15, which cannot build watchfiles.
          # Remove the pin once upstream handles this; see issue #101.
          python_version: "3.14"

      - name: "Upload SBOM artifacts"
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sbom-files
          path: |
            sbom-cyclonedx.json
            sbom-cyclonedx.xml
          if-no-files-found: error
          retention-days: 45

      - name: "SBOM summary"
        env:
          COMPONENT_COUNT: "${{ steps.sbom.outputs.component_count }}"
          DEPENDENCY_MANAGER: "${{ steps.sbom.outputs.dependency_manager }}"
        run: |
            # SBOM summary
            {
              echo "## SBOM Summary"
              echo "SBOM count: ${COMPONENT_COUNT}"
              echo "Tool used: ${DEPENDENCY_MANAGER}"
            } >> "$GITHUB_STEP_SUMMARY"

  grype:
    name: 'Grype Audit SBOM'
    runs-on: ubuntu-latest
    needs: 'sbom'
    if: ${{ !cancelled() && needs.sbom.result == 'success' }}
    timeout-minutes: 10
    permissions:
      issues: read  # Read maintainer-approved bypass issues
    steps:
      # yamllint disable-line rule:line-length
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: 'audit'

      - name: "Download SBOM artefact"
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: sbom-files

      - name: "Grype audit SBOM"
        id: grype-audit
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/grype-scan-action@f65dca2762823cfc8f376e32fee9baa6f3292696  # v0.6.2
        with:
          sbom: 'sbom-cyclonedx.json'
          fail-on: 'medium'
          # This add-on owns its whole dependency tree through uv.lock,
          # so every package, direct or transitive, is ours to bump.
          # Gate on all of them rather than only declared ones.
          dependency-policy: 'all'
          # Gate only when an upgrade exists; unfixed advisories are
          # still reported as warnings in the summary and SARIF.
          only-fixed: 'true'
          cache-db: 'true'
          artifact-name: 'grype-scan-results'
          retention-days: 90
          summary-title: 'Grype Vulnerability Scan'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          permit-fail: ${{ vars.NO_BLOCK_AUDIT_FAIL == 'true' }}
