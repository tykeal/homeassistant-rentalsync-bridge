---
upgrade:
  - |
    The Home Assistant add-on now runs on the
    `base-python:3.14-alpine3.24` base image, replacing Python 3.13 on
    Alpine 3.21, which reaches end of support in November 2026. The
    standalone Docker/Podman image moves to `python:3.14-slim`. No
    configuration changes are needed. If you install the Python package
    directly, Python 3.13 remains supported.
