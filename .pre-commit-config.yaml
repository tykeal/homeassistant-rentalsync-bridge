---
ci:
  autofix_commit_msg: |
    Chore: pre-commit autofixes

    Signed-off-by: pre-commit-ci[bot] <66853113+pre-commit-ci[bot]@users.noreply.github.com>
  autofix_prs: false
  autoupdate_commit_msg: |
    Chore: pre-commit autoupdate

    Signed-off-by: pre-commit-ci[bot] <66853113+pre-commit-ci[bot]@users.noreply.github.com>
  skip: [aislop]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-ast
      - id: check-json
      - id: check-merge-conflict
      - id: check-xml
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: no-commit-to-branch
        args:
          - --branch=main
      - id: requirements-txt-fixer
      - id: trailing-whitespace

  - repo: https://github.com/jorisroovers/gitlint
    rev: acc9d9de6369b76d22cb4167029d2035e8730b98 # frozen: v0.19.1
    hooks:
      - id: gitlint

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: c0f278f1254ccc8fb09676bcdb8d847e7db493e5  # frozen: v0.17.4
    hooks:
      - id: ruff-check
        files: ^rentalsync-bridge/(scripts|tests|src)/.+\.py$
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        files: ^rentalsync-bridge/(scripts|tests|src)/.+\.py$

  - repo: https://github.com/adrienverge/yamllint.git
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530  # frozen: v1.38.0
    hooks:
      - id: yamllint

  - repo: https://github.com/econchick/interrogate
    rev: a6268877efd41a21197445cc04cbf28f9c6facba # frozen: 1.7.0
    hooks:
      - id: interrogate
        files: ^rentalsync-bridge/(scripts|tests|src)/.+\.py$
        args:
          - -vv
          - --fail-under=100
          - --ignore-nested-functions
          - --ignore-nested-classes
          - --ignore-regex=^(health|protected|ical|success|http_error|unhandled_error|override_get_db)$
        additional_dependencies:
          - setuptools

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: ad26ebfa797fcb9b8f83275937c1c1d6e126719c  # frozen: v2.4.1
    hooks:
      - id: mypy
        files: ^rentalsync-bridge/src/.+\.py$
        args: [--config-file=.mypy.ini]
        additional_dependencies:
          - types-pytz
          - types-PyYAML
          - pytest
          - pytest-asyncio
          - fastapi
          - sqlmodel
          - pydantic
          - pydantic-settings
          - httpx
          - argon2-cffi>=25.1.0
          - sqlalchemy[asyncio]
          - cryptography
          - icalendar
          - apscheduler
          - aiosqlite

  - repo: https://github.com/fsfe/reuse-tool
    rev: ea739bff9c6daa1c4c8a5c5dfd069f3fb0374728  # frozen: v6.3.0
    hooks:
      - id: reuse

  - repo: https://github.com/kjanat/actionlint
    rev: 08bb2c4f0d039744455b87aef1c647fb8b66d37b  # frozen: v1.17.0
    hooks:
      - id: actionlint

  # Baselined in .aislop/ci-baseline.json, so only new findings fail.
  # CI runs it through lfreleng-actions/aislop-scan-action in
  # type-quality-gates.yaml; keep this pin in step with that action's.
  - repo: local
    hooks:
      - id: aislop
        name: aislop ci
        entry: aislop
        args: [ci]
        language: node
        additional_dependencies:
          - aislop@0.20.0
        pass_filenames: false
        require_serial: true
